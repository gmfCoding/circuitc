<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CircuitC Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>CircuitC Viewer</h1>
            <div class="status">
                <span id="connection-status" class="status-indicator disconnected">Disconnected</span>
                <span id="sim-time">Time: 0.000s</span>
                <span id="sim-steps">Steps: 0</span>
            </div>
        </header>

        <div class="main-content">
            <aside class="controls">
                <div class="control-group">
                    <h3>Circuit</h3>
                    <input type="text" id="circuit-file" placeholder="Circuit file path" 
                           value="../../examples/test_comprehensive.txt">
                    <button id="load-btn" class="btn btn-primary">Load Circuit</button>
                </div>

                <div class="control-group">
                    <h3>Simulation</h3>
                    <button id="start-btn" class="btn btn-success">Start</button>
                    <button id="stop-btn" class="btn btn-warning">Stop</button>
                    <button id="step-btn" class="btn btn-secondary">Step</button>
                    <button id="reset-btn" class="btn btn-danger">Reset</button>
                </div>

                <div class="control-group">
                    <h3>Speed</h3>
                    <input type="range" id="speed-slider" min="0.1" max="5" step="0.1" value="1">
                    <span id="speed-value">1.0x</span>
                </div>

                <div class="control-group">
                    <h3>Current Visualization</h3>
                    <input type="range" id="current-slider" min="0.1" max="10" step="0.1" value="1">
                    <span id="current-value">1.0x</span>
                </div>

                <div class="control-group">
                    <h3>Circuit Info</h3>
                    <div class="info-text">
                        <div>Elements: <span id="element-count">0</span></div>
                        <div>Nodes: <span id="node-count">0</span></div>
                    </div>
                </div>

                <div class="control-group">
                    <h3>Legend</h3>
                    <div class="legend">
                        <div class="legend-item"><span class="color-box voltage-high"></span>High Voltage (+)</div>
                        <div class="legend-item"><span class="color-box voltage-mid"></span>Mid Voltage</div>
                        <div class="legend-item"><span class="color-box voltage-low"></span>Low Voltage</div>
                        <div class="legend-item"><span class="color-box voltage-neg"></span>Negative Voltage</div>
                        <div class="legend-item"><span class="wire-sample"></span>Current Flow</div>
                    </div>
                </div>
            </aside>

            <main class="canvas-container">
                <canvas id="circuit-canvas"></canvas>
            </main>
        </div>
    </div>

    <script src="circuit.js"></script>
</body>
</html>
